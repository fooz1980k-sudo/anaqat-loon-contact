    @font-face {

    :root {
      --bg: #F5F0E8;
      --card: #FCFAF6;
      --ink: #2A231E;
      --muted: #6B5E4E;
      --gold: #C9A86A;
      --gold-text: #A98551;
      --gold-dark: #8B6A32;
      --line: #E4D5B8;
      --shadow: 0 8px 24px rgba(42, 35, 30, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
    }

    body {
      font-family: "Noto Naskh Arabic", "Amiri", "Traditional Arabic", serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      padding: 28px 20px 40px;
      padding-top: max(28px, env(safe-area-inset-top));
      padding-bottom: max(40px, env(safe-area-inset-bottom));
    }

    .frame {
      max-width: 430px;
      margin: 0 auto;
      border: 1px solid var(--gold);
      padding: 36px 22px 28px;
      position: relative;
      background:
        linear-gradient(var(--bg), var(--bg)) padding-box,
        linear-gradient(180deg, #E8D5A6, var(--gold) 40%, #B8934A) border-box;
      border: 1px solid transparent;
      box-shadow: var(--shadow);
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      height: 1px;
      background: var(--gold);
      opacity: 0.55;
    }
    .frame::before { top: 8px; }
    .frame::after { bottom: 8px; }

    header {
      text-align: center;
    }

    .logo {
      width: 148px;
      height: 148px;
      object-fit: contain;
      display: block;
      margin: 4px auto 18px;
    }

    h1 {
      font-family: "Amiri", "Noto Naskh Arabic", serif;
      font-weight: 700;
      font-size: 2.35rem;
      line-height: 1.25;
      color: var(--ink);
      letter-spacing: 0;
    }

    .brand-en {
      font-family: "Amiri", Palatino, "Times New Roman", serif;
      font-size: 0.78rem;
      letter-spacing: 0.28em;
      color: var(--gold-text);
      margin-top: 2px;
      text-transform: uppercase;
    }

    .sub {
      margin-top: 14px;
      color: var(--gold-dark);
      font-size: 0.98rem;
      font-weight: 400;
    }

    .rule {
      width: 72px;
      height: 1px;
      background: var(--gold);
      margin: 22px auto 26px;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 13px 16px;
      min-height: 72px;
      box-shadow: 0 1px 2px rgba(42, 35, 30, 0.04);
      transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover,
    .btn:focus-visible {
      border-color: var(--gold);
      box-shadow: 0 4px 14px rgba(169, 133, 81, 0.18);
      transform: translateY(-1px);
      outline: none;
    }
    .btn:active { transform: translateY(0); }

    .icon {
      flex: 0 0 46px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--gold);
      display: grid;
      place-items: center;
      background: #FBF6EC;
      color: var(--gold-dark);
    }
    .icon svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .btn-text {
      display: flex;
      flex-direction: column;
      gap: 0;
      text-align: right;
      min-width: 0;
    }
    .btn-text strong {
      font-family: "Amiri", "Noto Naskh Arabic", serif;
      font-weight: 700;
      font-size: 1.28rem;
      line-height: 1.3;
      color: var(--ink);
    }
    .btn-text span {
      font-family: "Amiri", Palatino, "Times New Roman", serif;
      font-size: 0.92rem;
      color: var(--gold-text);
      letter-spacing: 0.02em;
      direction: ltr;
      unicode-bidi: isolate;
    }

    .note {
      margin: 26px 8px 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.9;
    }

    footer {
      margin-top: 22px;
      text-align: center;
      color: var(--gold-text);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
    }
    footer .en {
      font-family: "Amiri", Palatino, "Times New Roman", serif;
      letter-spacing: 0.18em;
    }

    @media (min-width: 720px) {
      body { padding-top: 48px; }
      .frame { padding: 44px 32px 32px; }
      .logo { width: 168px; height: 168px; }
    }
  </style>
</head>
